<section class="section"><div class="container form-layout"><div><p class="eyebrow">Faça parte</p><h1>Cadastro de voluntário/apoiador</h1><p>Preencha seus dados. As informações desta demonstração ficam somente no localStorage do seu navegador.</p></div><form id="cadastroForm" novalidate><div class="campo"><label for="nome">Nome completo *</label><input id="nome" name="nome" autocomplete="name" required minlength="3"><small class="erro" id="erro-nome"></small></div><div class="campo"><label for="email">E-mail *</label><input id="email" name="email" type="email" autocomplete="email" required><small class="erro" id="erro-email"></small></div><div class="campo"><label for="cpf">CPF *</label><input id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required><small class="erro" id="erro-cpf"></small></div><div class="campo"><label for="telefone">Telefone *</label><input id="telefone" name="telefone" inputmode="tel" placeholder="(11) 99999-9999" maxlength="15" required><small class="erro" id="erro-telefone"></small></div><div class="campo"><label for="cep">CEP *</label><input id="cep" name="cep" inputmode="numeric" placeholder="00000-000" maxlength="9" required><small class="erro" id="erro-cep"></small></div><div class="campo"><label for="participacao">Como deseja participar? *</label><select id="participacao" name="participacao" required><option value="">Selecione</option><option>Voluntariado</option><option>Doação</option><option>Ambos</option></select><small class="erro" id="erro-participacao"></small></div><button class="button" type="submit">Salvar cadastro</button></form></div></section>
